spring.datasource.url=jdbc:mysql://${MYSQL_URL}:${MYSQL_PORT}/${MYSQL_DATABASE}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.max-lifetime=2000000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=30000
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=validate
spring.security.filter.dispatcher-types=REQUEST, ERROR
spring.servlet.multipart.max-file-size=10GB
spring.servlet.multipart.max-request-size=10GB
cs.settings.default-values.SERVER_SETTING.DOCKER_INSTALLATION=true
cs.settings.default-values.SERVER_SETTING.REPOSITORY_PATH=/opt/collab/git
cs.settings.default-values.SERVER_SETTING.LIBRARY_PATH=/opt/collab/lib
cs.settings.default-values.SERVER_SETTING.SERVER_URL=${SERVER_URL}
cs.settings.default-values.SERVER_SETTING.SEARCH_ENABLED=${SEARCH_ENABLED}
cs.settings.default-values.SEARCH_SETTING.SCHEMA=${SEARCH_SCHEMA}
cs.settings.default-values.SEARCH_SETTING.HOST=${SEARCH_HOST}
cs.settings.default-values.SEARCH_SETTING.PORT=${SEARCH_PORT}
