name: Build and Deploy LCA Collaboration Server

on:
  push:
    branches:
      - main
      - 'dev/**'
      - 'release/**'
      - 'feature/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Determine Deployment Environment
        id: mapenv
        run: |
          if [[ "${GITHUB_REF_NAME}" == feature/* ]]; then
            echo "env=dev" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF_NAME}" == release/* ]]; then
            echo "env=stage" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF_NAME}" == main ]]; then
            echo "env=prod" >> $GITHUB_OUTPUT
          fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Checkout LCA Repository
        uses: actions/checkout@v4

      - name: Checkout Other Repositories
        uses: actions/checkout@v4
        with:
          repository: GreenDelta/search-wrapper
          path: search-wrapper-repo
          ref: 1.1.7

      - name: Checkout OLCA Modules
        uses: actions/checkout@v4
        with:
          repository: GreenDelta/olca-modules
          path: olca-modules

      - name: Create Ephemeral Azure VM
        id: create_vm
        run: |
          VM_NAME=lca-ephemeral-${{ github.run_id }}-${{ github.run_number }}
          echo "VM_NAME=$VM_NAME" >> $GITHUB_ENV

          az vm create \
            --resource-group ${{ secrets.AZ_RESOURCE_GROUP }} \
            --name $VM_NAME \
            --image ${{ vars.AZ_VM_IMAGE }} \
            --admin-username ${{ secrets.AZ_VM_USERNAME }} \
            --generate-ssh-keys \
            --size ${{ vars.AZ_VM_SIZE }} \
            --output json > vm.json

          VM_IP=$(jq -r '.publicIpAddress' vm.json)
          echo "VM_IP=$VM_IP" >> $GITHUB_ENV

      - name: Allow runner IP on VM NSG for 22/80/8080
        run: |
          set -euo pipefail
          MYIP=$(curl -s https://api.ipify.org)
          NSG_NAME="${VM_NAME}NSG"

          next_priority () {
            local base=$1
            local used pri
            mapfile -t used < <(az network nsg rule list \
              --resource-group ${{ secrets.AZ_RESOURCE_GROUP }} \
              --nsg-name "$NSG_NAME" \
              --query '[].priority' -o tsv | sort -n | uniq)
            pri=$base
            while printf '%s\n' "${used[@]:-}" | grep -qx "$pri"; do pri=$((pri+10)); done
            if [ "$pri" -lt 100 ] || [ "$pri" -gt 4096 ]; then
              echo "No free NSG priority in 100–4096" >&2; exit 1
            fi
            echo "$pri"
          }

          BASE=1200
          for PORT in 22 80 8080; do
            PRIO=$(next_priority "$BASE")
            az network nsg rule create \
              --resource-group ${{ secrets.AZ_RESOURCE_GROUP }} \
              --nsg-name "$NSG_NAME" \
              --name Allow-${PORT}-${{ github.run_id }} \
              --priority "$PRIO" \
              --access Allow \
              --protocol Tcp \
              --direction Inbound \
              --source-address-prefixes "${MYIP}/32" \
              --destination-port-ranges "$PORT" \
              --description "Temporary allow from GH runner ${MYIP} to port $PORT"
            BASE=$((PRIO+10))
          done

      # --- Hardened non-interactive MariaDB install + line-buffered script run ---
      - name: Install Prerequisites on Remote VM (non-interactive, preseed MariaDB)
        run: |
          echo "Transferring install-prerequisites.sh to VM..."
          scp -o StrictHostKeyChecking=no scripts/install-prerequisites.sh \
            ${{ secrets.AZ_VM_USERNAME }}@${{ env.VM_IP }}:/home/${{ secrets.AZ_VM_USERNAME }}/

          echo "Running install-prerequisites.sh on VM (hard non-interactive, line-buffered)..."
          ssh -o StrictHostKeyChecking=no ${{ secrets.AZ_VM_USERNAME }}@${{ env.VM_IP }} <<'EOF'
            set -Eeuo pipefail

            # Global no-prompt settings
            export DEBIAN_FRONTEND=noninteractive
            export DEBIAN_PRIORITY=critical
            export DEBCONF_NONINTERACTIVE_SEEN=true
            export APT_LISTCHANGES_FRONTEND=none
            export NEEDRESTART_MODE=a
            export UCF_FORCE_CONFFNEW=1

            # Extra dpkg/apt options and disable PTY to avoid odd debconf behavior
            APT_OPTS='-yq -o Dpkg::Use-Pty=0 -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold -o Dpkg::Progress-Fancy=0'

            sudo apt-get update -yq
            sudo apt-get install -yq debconf-utils apt-utils coreutils moreutils || true
            echo 'DPkg::Options { "--force-confdef"; "--force-confold"; };' | sudo tee /etc/apt/apt.conf.d/99force-noninteractive >/dev/null || true

            # Preseed MariaDB feedback prompt (belt & suspenders)
            for owner in \
              mariadb-server mariadb-server-core \
              mariadb-server-10.6 mariadb-server-10.11 \
              mariadb-server-11.0 mariadb-server-11.1 mariadb-server-11.2 mariadb-server-11.3 \
              mariadb-server-12.0 mariadb-server-12.1 mariadb-server-12.2
            do
              echo "$owner mariadb-server/feedback_plugin boolean false" | sudo debconf-set-selections || true
              echo "$owner mariadb-server/feedback_plugin seen true"    | sudo debconf-set-selections || true
            done

            # Hard-disable plugin via config before any install
            sudo install -d /etc/mysql/mariadb.conf.d
            sudo tee /etc/mysql/mariadb.conf.d/99-disable-feedback.cnf >/dev/null <<'CFG'
            
            [mariadb]
            plugin_load_add=
            CFG
            
                        chmod +x install-prerequisites.sh
            
                        # ---- RUN your script with line-buffered output and a bounded timeout ----
                        # stdbuf is from coreutils; if moreutils is present, ts adds timestamps
                        if command -v stdbuf >/dev/null 2>&1; then
                          RUNNER="stdbuf -oL -eL"
                        else
                          RUNNER=""
                        fi
            
                        # Make sure we always dump MariaDB status & logs if the script fails or times out
                        set +e
                        ${RUNNER} timeout 12m ./install-prerequisites.sh ${APT_OPTS} 2>&1 | sed -u 's/^/[install-prereq] /'
                        rc=$?
                        set -e
            
                        if [ $rc -ne 0 ]; then
                          echo "install-prerequisites.sh exited with code $rc — showing MariaDB status & last 200 lines of logs"
                          sudo systemctl status mariadb --no-pager || true
                          sudo journalctl -u mariadb --no-pager -n 200 || true
                          exit $rc
                        fi
            
                        # Extra readiness probe (fast) so the next steps don't "look hung"
                        echo "Sanity check: mysqladmin ping..."
                        for i in $(seq 1 60); do
                          if sudo mysqladmin ping >/dev/null 2>&1; then
                            echo "MariaDB is responding (mysqladmin ping)."
                            break
                          fi
                          echo "Waiting for MariaDB to respond... ($i/60)"
                          sleep 2
                        done
                      EOF

      - name: Copy Configuration Files to Remote VM
        run: |
          scp -o StrictHostKeyChecking=no scripts/copy-configs.sh \
            ${{ secrets.AZ_VM_USERNAME }}@${{ env.VM_IP }}:/home/${{ secrets.AZ_VM_USERNAME }}/
          scp -o StrictHostKeyChecking=no -r configs \
            ${{ secrets.AZ_VM_USERNAME }}@${{ env.VM_IP }}:/home/${{ secrets.AZ_VM_USERNAME }}/
          ssh -o StrictHostKeyChecking=no ${{ secrets.AZ_VM_USERNAME }}@${{ env.VM_IP }} <<EOF
            chmod +x copy-configs.sh
            ./copy-configs.sh ${{ steps.mapenv.outputs.env }}
          EOF

      - name: Build Java Projects (Search Wrapper, OLCA, LCA Repo)
        run: |
          cd search-wrapper-repo && mvn clean install -DskipTests
          cd ../olca-modules && mvn clean install -DskipTests
          cd .. && mvn clean install -DskipTests

      - name: Upload WAR File
        uses: actions/upload-artifact@v4
        with:
          name: lca-war
          path: backend/target/collaboration-server-backend-*.war

      - name: Copy WAR to Tomcat
        run: |
          scp -o StrictHostKeyChecking=no backend/target/collaboration-server-backend-*.war \
            ${{ secrets.AZ_VM_USERNAME }}@${{ env.VM_IP }}:/home/${{ secrets.AZ_VM_USERNAME }}/
          ssh -o StrictHostKeyChecking=no ${{ secrets.AZ_VM_USERNAME }}@${{ env.VM_IP }} << 'EOF'
            set -euo pipefail
            sudo mv /home/${{ secrets.AZ_VM_USERNAME }}/collaboration-server-backend-*.war /opt/tomcat/webapps/lca-collaboration.war
          EOF

      - name: Generate SAS Token
        id: gensas
        run: |
          EXPIRY=$(date -u -d '1 hour' '+%Y-%m-%dT%H:%MZ')
          ACCOUNT_KEY=$(az storage account keys list \
            --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
            --query '[0].value' -o tsv)
          SAS=$(az storage container generate-sas \
            --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
            --name ${{ secrets.AZURE_CONTAINER_NAME }} \
            --permissions rl \
            --expiry "$EXPIRY" \
            --account-key "$ACCOUNT_KEY" \
            --https-only \
            --output tsv)
          echo "sas_token=$SAS" >> "$GITHUB_OUTPUT"

      - name: Install AzCopy & Download Artifacts
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.AZ_VM_USERNAME }}@${{ env.VM_IP }} << EOF
            set -euo pipefail
            curl -sL https://aka.ms/downloadazcopy-v10-linux | tar -xz --strip-components=1
            sudo mv azcopy /usr/local/bin/
            sudo mkdir -p /opt/lca-cs/repository
            sudo chown -R $USER:$USER /opt/lca-cs/repository
            sudo chmod -R 777 /opt/lca-cs/repository
            azcopy copy "https://${{ secrets.AZURE_STORAGE_ACCOUNT }}.blob.core.windows.net/${{ secrets.AZURE_CONTAINER_NAME }}/data/*?${{ steps.gensas.outputs.sas_token }}" "/opt/lca-cs/repository/" --recursive
          EOF

      - name: Copy DB Initialization
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.AZ_VM_USERNAME }}@${{ env.VM_IP }} << EOF
            set -euo pipefail
            sudo mkdir -p /opt/lca-cs/init
            sudo chown -R $USER:$USER /opt/lca-cs/init
            sudo chmod -R 777 /opt/lca-cs/init
            azcopy copy "https://${{ secrets.AZURE_STORAGE_ACCOUNT }}.blob.core.windows.net/${{ secrets.AZURE_CONTAINER_NAME }}/DB_initializer/*?${{ steps.gensas.outputs.sas_token }}" "/opt/lca-cs/init/" --recursive
          EOF

      - name: Wait for MariaDB (on VM) before init
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.AZ_VM_USERNAME }}@${{ env.VM_IP }} << 'EOF'
            set -euo pipefail
            for i in {1..30}; do
              if sudo mysqladmin ping >/dev/null 2>&1; then
                echo "MariaDB is up."; exit 0
              fi
              echo "Waiting for MariaDB..."; sleep 2
            done
            echo "MariaDB did not start in time"; exit 1
          EOF

      - name: Run DB init on Azure VM
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.AZ_VM_USERNAME }}@${{ env.VM_IP }} << 'EOF'
            set -euo pipefail
            export JAVA_HOME=/opt/java/jdk-21.0.3+9
            export PATH=$JAVA_HOME/bin:$PATH
            [ -x "$JAVA_HOME/bin/java" ] || { echo "Java binary not found in $JAVA_HOME"; exit 1; }
            java -jar /opt/lca-cs/init/db_initializer2.0.0.jar /opt/lca-cs/init/installer.confg
          EOF

      - name: Copy SQL files to VM
        run: |
          scp -o StrictHostKeyChecking=no -r backend/src/main/resources/com/greendelta/collaboration/config/database/ \
            ${{ secrets.AZ_VM_USERNAME }}@${{ env.VM_IP }}:/opt/lca-cs/init/sql

      - name: Execute table updates
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.AZ_VM_USERNAME }}@${{ env.VM_IP }} << 'EOF'
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            sudo apt-get update -y
            sudo apt-get install -y mariadb-client

            echo "Executing table updates"
            cd /opt/lca-cs/init/sql
            for file in $(ls -1v *.sql); do
              echo "Running $file..."
              mysql -h localhost -u "${{ secrets.DB_USER }}" -p"${{ secrets.DB_PASSWORD }}" "${{ vars.DB_NAME }}" < "$file"
            done

            echo "Executing data updates"
            cd /opt/lca-cs/init/db_updates
            for file in $(ls -1v *.sql); do
              echo "Running $file..."
              mysql -h localhost -u "${{ secrets.DB_USER }}" -p"${{ secrets.DB_PASSWORD }}" "${{ vars.DB_NAME }}" < "$file"
            done
          EOF

      - name: Restart services using Azure CLI
        run: |
          az vm run-command invoke \
            --resource-group ${{ secrets.AZ_RESOURCE_GROUP }} \
            --name ${{ env.VM_NAME }} \
            --command-id RunShellScript \
            --scripts '
              echo "Restarting services..."
              sudo systemctl restart nginx || true
              sudo systemctl restart tomcat || sudo systemctl restart tomcat9 || true
              sudo systemctl restart opensearch || true
            '

      - name: Reindex Repos
        run: |
          scp -o StrictHostKeyChecking=no scripts/reindex.sh \
            ${{ secrets.AZ_VM_USERNAME }}@${{ env.VM_IP }}:/home/${{ secrets.AZ_VM_USERNAME }}/
          ssh -o StrictHostKeyChecking=no ${{ secrets.AZ_VM_USERNAME }}@${{ env.VM_IP }} <<'EOF'
            set -euo pipefail
            chmod +x reindex.sh
            ./reindex.sh
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests pytest-dependency pyyaml

      - name: Wait for app to be up on port 8080
        run: |
          echo "Waiting for app to become available on http://${{ env.VM_IP }}:8080 ..."
          MAX_RETRIES=20
          RETRY_INTERVAL=10
          COUNT=0
          until curl --fail --silent --head http://${{ env.VM_IP }}:8080/lca-collaboration; do
            COUNT=$((COUNT+1))
            echo "Attempt $COUNT of $MAX_RETRIES: App not yet available..."
            if [ "$COUNT" -ge "$MAX_RETRIES" ]; then
              echo "App did not become ready after $((MAX_RETRIES * RETRY_INTERVAL)) seconds."
              exit 1
            fi
            sleep $RETRY_INTERVAL
          done
          echo "App is running on http://${{ env.VM_IP }}:8080"

      - name: Run Cypress UI Tests on Remote VM
        run: |
          scp -o StrictHostKeyChecking=no -r tests/e2e/cypress_core_functionalities_daily_check \
            ${{ secrets.AZ_VM_USERNAME }}@${{ env.VM_IP }}:/home/${{ secrets.AZ_VM_USERNAME }}/
          ssh -o StrictHostKeyChecking=no ${{ secrets.AZ_VM_USERNAME }}@${{ env.VM_IP }} << 'EOF'
            set -euo pipefail
            cd /home/${{ secrets.AZ_VM_USERNAME }}/cypress_core_functionalities_daily_check
            curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
            export DEBIAN_FRONTEND=noninteractive
            sudo apt-get install -y nodejs
            npm install
            npx cypress run --reporter mochawesome || exit 1
          EOF

      - name: Copy Cypress Report from VM
        if: always()
        run: |
          scp -o StrictHostKeyChecking=no -r \
            ${{ secrets.AZ_VM_USERNAME }}@${{ env.VM_IP }}:/home/${{ secrets.AZ_VM_USERNAME }}/cypress_core_functionalities_daily_check/cypress/reports ./cypress-report
          scp -o StrictHostKeyChecking=no -r \
            ${{ secrets.AZ_VM_USERNAME }}@${{ env.VM_IP }}:/home/${{ secrets.AZ_VM_USERNAME }}/cypress_core_functionalities_daily_check/cypress/screenshots ./cypress-screenshots || echo "No screenshots to copy"

      - name: Upload Cypress Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-ui-report
          path: ./cypress-report

      - name: Upload Cypress Screenshots Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-ui-screenshots
          path: ./cypress-screenshots

      - name: Run API Tests
        env:
          VM_IP: ${{ env.VM_IP }}
          AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
        run: |
          pytest tests/integration/api_test/complete_api_test_repos_testing_mvp.py

      - name: Clean Up Ephemeral VM and Resources
        if: always()
        run: |
          echo "Cleaning up all resources for $VM_NAME"
          for PORT in 22 80 8080; do
            az network nsg rule delete \
              --resource-group ${{ secrets.AZ_RESOURCE_GROUP }} \
              --nsg-name ${VM_NAME}NSG \
              --name Allow-${PORT}-${{ github.run_id }} || true
          done

          if az vm show --resource-group ${{ secrets.AZ_RESOURCE_GROUP }} --name $VM_NAME &> /dev/null; then
            az vm delete --yes --resource-group ${{ secrets.AZ_RESOURCE_GROUP }} --name $VM_NAME
          fi

          OS_DISK_NAME=$(az disk list --resource-group ${{ secrets.AZ_RESOURCE_GROUP }} --query "[?contains(name,'$VM_NAME')].name" -o tsv)
          if [ -n "$OS_DISK_NAME" ]; then
            az disk delete --name "$OS_DISK_NAME" --resource-group ${{ secrets.AZ_RESOURCE_GROUP }} --yes
          fi

          NIC_NAME=$(az network nic list --resource-group ${{ secrets.AZ_RESOURCE_GROUP }} --query "[?contains(name,'$VM_NAME')].name" -o tsv)
          if [ -n "$NIC_NAME" ]; then
            az network nic ip-config update \
              --name ipconfig$VM_NAME \
              --nic-name $NIC_NAME \
              --resource-group ${{ secrets.AZ_RESOURCE_GROUP }} \
              --remove publicIpAddress || true
            az network nic update \
              --name $NIC_NAME \
              --resource-group ${{ secrets.AZ_RESOURCE_GROUP }} \
              --remove networkSecurityGroup || true
            az network nic delete --name $NIC_NAME --resource-group ${{ secrets.AZ_RESOURCE_GROUP }}
          fi

          az network public-ip delete \
            --resource-group ${{ secrets.AZ_RESOURCE_GROUP }} \
            --name ${VM_NAME}PublicIP || true

          az network nsg delete \
            --resource-group ${{ secrets.AZ_RESOURCE_GROUP }} \
            --name ${VM_NAME}NSG || true

          echo "Cleanup complete."
